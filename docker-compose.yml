services:
  db:
    image: postgres:15-alpine
    container_name: cloudnotes_db
    restart: always
    environment:
      POSTGRES_DB: cloudnotes
      POSTGRES_USER: cloudnotes_user
      POSTGRES_PASSWORD: cloudnotes_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudnotes_user -d cloudnotes"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: cloudnotes_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://cloudnotes_user:cloudnotes_password@db:5432/cloudnotes
      - SECRET_KEY=super-secret-key-12345
      - UPLOAD_FOLDER=uploads
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

volumes:
  pgdata:
